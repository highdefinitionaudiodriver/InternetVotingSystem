{{- if and (eq .Values.storage.backend "postgres") (not .Values.storage.postgres.existingSecret) }}
{{- if not .Values.storage.postgres.dsn }}
{{- fail "storage.postgres.dsn or storage.postgres.existingSecret must be set when storage.backend=postgres" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ivs.fullname" . }}-pg
  labels:
    {{- include "ivs.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ .Values.storage.postgres.dsn | quote }}
{{- end }}
