apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ivs.fullname" . }}-web
  labels:
    {{- include "ivs.labels" . | nindent 4 }}
    component: web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ivs.selectorLabels" . | nindent 6 }}
      component: web
  template:
    metadata:
      labels:
        {{- include "ivs.selectorLabels" . | nindent 8 }}
        component: web
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ivs.fullname" . }}-web
  labels:
    {{- include "ivs.labels" . | nindent 4 }}
    component: web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "ivs.selectorLabels" . | nindent 4 }}
    component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
