apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ivs.fullname" . }}-api
  labels:
    {{- include "ivs.labels" . | nindent 4 }}
    component: api
spec:
  # SQLite is single-writer; force replicaCount=1 in that case to avoid two
  # pods racing for the same PVC.
  replicas: {{ if eq .Values.storage.backend "sqlite" }}1{{ else }}{{ .Values.replicaCount }}{{ end }}
  selector:
    matchLabels:
      {{- include "ivs.selectorLabels" . | nindent 6 }}
      component: api
  template:
    metadata:
      labels:
        {{- include "ivs.selectorLabels" . | nindent 8 }}
        component: api
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "ivs.api.args" . | nindent 12 }}
          env:
            - name: IVS_RATE_LIMIT_ENABLED
              value: {{ .Values.rateLimit.enabled | quote }}
            - name: IVS_RATE_LIMIT_WRITE_CAPACITY
              value: {{ .Values.rateLimit.writeCapacity | quote }}
            - name: IVS_RATE_LIMIT_READ_CAPACITY
              value: {{ .Values.rateLimit.readCapacity | quote }}
            - name: IVS_RATE_LIMIT_WRITE_REFILL_PER_SEC
              value: {{ .Values.rateLimit.writeRefillPerSecond | quote }}
            - name: IVS_RATE_LIMIT_READ_REFILL_PER_SEC
              value: {{ .Values.rateLimit.readRefillPerSecond | quote }}
          {{ if eq .Values.storage.backend "postgres" }}
            - name: IVS_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.storage.postgres.existingSecret }}{{ .Values.storage.postgres.existingSecret }}{{ else }}{{ include "ivs.fullname" . }}-pg{{ end }}
                  key: dsn
          {{ end }}
          ports:
            - name: http
              containerPort: 8787
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          {{- if eq .Values.storage.backend "sqlite" }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if eq .Values.storage.backend "sqlite" }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ivs.fullname" . }}-data
      {{- end }}
