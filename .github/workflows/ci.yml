name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run all checks
        run: python tools/check_all.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: internet-voting-system-api:ci

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          load: true
          tags: internet-voting-system-web:ci

      - name: Smoke test API container
        run: |
          # Start the API container with in-memory storage, wait for /health,
          # run the smoke check, then tear down.
          docker run -d --rm --name ivs-ci -p 8787:8787 internet-voting-system-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            sleep 1
          done
          python tools/smoke_check.py --base-url http://127.0.0.1:8787
          # Also verify the Prometheus metrics format actually renders.
          curl -fsS -H 'Accept: text/plain' http://127.0.0.1:8787/metrics \
            | grep -q 'internet_voting_total_elections'
          docker stop ivs-ci

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voting
          POSTGRES_PASSWORD: voting
          POSTGRES_DB: voting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voting -d voting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psycopg
        run: pip install "psycopg[binary]>=3.1"

      - name: Run PostgreSQL integration tests
        working-directory: services/api
        env:
          IVS_TEST_PG_DSN: "postgresql://voting:voting@127.0.0.1:5432/voting"
        run: python -m unittest tests.test_postgres_integration -v

  helm-chart-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: helm lint (memory profile)
        run: helm lint deploy/helm/internet-voting-system

      - name: helm template (memory profile)
        run: helm template ivs deploy/helm/internet-voting-system --set storage.backend=memory > /tmp/ivs-memory.yaml

      - name: helm template (sqlite profile)
        run: helm template ivs deploy/helm/internet-voting-system --set storage.backend=sqlite > /tmp/ivs-sqlite.yaml

      - name: helm template (postgres profile)
        run: |
          helm template ivs deploy/helm/internet-voting-system \
            --set storage.backend=postgres \
            --set storage.postgres.dsn=postgresql://voting:voting@pg.svc.cluster.local:5432/voting \
            > /tmp/ivs-postgres.yaml

      - name: Validate rendered manifests with kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary -schema-location default \
            /tmp/ivs-memory.yaml /tmp/ivs-sqlite.yaml /tmp/ivs-postgres.yaml

  compose-smoke:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bring up the sqlite profile
        run: docker compose --profile sqlite up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            sleep 1
          done

      - name: Wait for Web client
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/ | grep -q 'Internet Voting System'; then
              echo "Web client is serving"
              break
            fi
            sleep 1
          done

      - name: Smoke check against compose stack
        run: python tools/smoke_check.py --base-url http://127.0.0.1:8787

      - name: Tear down
        if: always()
        run: docker compose --profile sqlite down --volumes
