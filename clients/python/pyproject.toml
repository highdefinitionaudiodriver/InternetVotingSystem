[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivs-client"
version = "0.1.0"
description = "Stdlib-only Python SDK for the InternetVotingSystem API"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "InternetVotingSystem contributors" }]
license = { text = "MIT" }
keywords = ["voting", "audit", "japan", "jpki"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Source = "https://github.com/highdefinitionaudiodriver/InternetVotingSystem"

[tool.setuptools.packages.find]
where = ["."]
include = ["ivs_client*"]
